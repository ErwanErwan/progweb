services:
  api:
    build: 
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=td7
      - REDIS_URI=redis://redis:6379
    volumes:
      - ./src:/app/src
    depends_on:
      - mongodb
      - redis

  mongodb:
    image: mongo:8.0
    environment:
      - MONGO_INITDB_DATABASE=td7
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"

volumes:
  mongodb_data: